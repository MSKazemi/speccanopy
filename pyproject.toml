[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speccanopy"
version = "0.3.0"
description = "Adaptive recursive software architecture design engine (deterministic prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3"]

[project.scripts]
speccanopy = "speccanopy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
